<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoList - 2572015</title>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <link rel="stylesheet" href="style.css">
  <style>

  </style>
</head>

<body>
  <div class="container">
    <h2>My To Do List</h2>
    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Tambah tugas..." maxlength="20">
      <button id="btnTambah">Tambah</button>
    </div>
    <h3>Belum Selesai</h3>
    <ul id="taskList">
    </ul>
    <h3>Sudah Selesai (Riwayat)</h3>
    <table id="completedTable">
      <thead>
        <tr>
          <th>Nama Tugas</th>
          <th style="width: 100px;">Aksi</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>
  <script src="script.js"></script>
  <footer>
    <strong>&copy; 2026 2572015 - Steven Theodore Alden. All rights reserved.</strong>
  </footer>
</body>

</html>
